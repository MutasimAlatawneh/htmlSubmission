<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
</head>
<body>

    <h1>User Registration Form</h1>

    <form action="#" method="POST">
        <div>
            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required minlength="3">
        </div>
        <br>

        <div>
            <label for="email">Email Address:</label><br>
            <input type="email" id="email" name="email" required>
        </div>
        <br>

        <div>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" required minlength="8">
        </div>
        <br>

        <div>
            <label>Role:</label><br>
            <input type="radio" id="role-dev" name="role" value="developer" required>
            <label for="role-dev">Developer</label><br>
            
            <input type="radio" id="role-designer" name="role" value="designer">
            <label for="role-designer">Designer</label>
        </div>
        <br>

        <div>
            <label for="country">Country:</label><br>
            <select id="country" name="country" required>
                <option value="">--Please choose an option--</option>
                <option value="us">United States</option>
                <option value="ca">Canada</option>
                <option value="uk">United Kingdom</option>
            </select>
        </div>
        <br>

        <div>
            <label for="bio">Short Bio:</label><br>
            <textarea id="bio" name="bio" rows="4" minlength="10" required></textarea>
        </div>
        <br>

        <div>
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the terms and conditions</label>
        </div>
        <br>

        <div>
            <button type="submit">Register</button>
        </div>

    </form>

</body>
</html>
